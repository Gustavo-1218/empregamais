<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Work</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="loginpage.css">
</head>

<body>

    <main class="pagina-login">

        <!-- =====================================================
             LADO ESQUERDO
        ====================================================== -->

        <section class="lado-esquerdo">

            <!-- LOGO -->

            <div class="logo-principal">

                <img
                    src="nova logo.png"
                    alt="Next Work"
                >

            </div>


            <!-- =================================================
                 APRESENTAÇÃO DO NEXT WORK
            ================================================== -->

            <div class="inicio-area">

                <!-- ETIQUETA -->

                <div class="tag">

                    <span>✦</span>

                    CONECTANDO PESSOAS

                </div>


                <!-- TÍTULO -->

                <div class="titulo-inicio">

                    <h1>

                        Conectamos

                        <span>talentos</span>

                        e oportunidades.

                    </h1>

                </div>


                <!-- DESCRIÇÃO -->

                <p class="description">

                    Uma plataforma criada para aproximar pessoas,
                    empresas e novas oportunidades de forma simples
                    e inteligente.

                </p>


                <!-- =================================================
                     BOTÕES
                ================================================== -->

                <div class="buttons">

                    <a
                        href="loginpage.html"
                        class="button primary"
                    >

                        Começar agora

                        <span>→</span>

                    </a>


                    <a
                        href="saibamais.html"
                        class="button secondary"
                    >

                        Saiba mais

                    </a>

                </div>


                <!-- =================================================
                     CARDS
                ================================================== -->

                <div class="cards">

                    <!-- TALENTOS -->

                    <button
                        type="button"
                        class="card"
                        data-node="talentos"
                    >

                        <div class="card-icon talentos">

                            <svg viewBox="0 0 24 24">

                                <circle
                                    cx="9"
                                    cy="8"
                                    r="3"
                                ></circle>

                                <path
                                    d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"
                                ></path>

                                <circle
                                    cx="17"
                                    cy="9"
                                    r="2"
                                ></circle>

                                <path
                                    d="M16 14c2.8 0 5 2.2 5 5"
                                ></path>

                            </svg>

                        </div>


                        <div>

                            <h3>
                                Talentos
                            </h3>

                            <p>
                                Encontre oportunidades.
                            </p>

                            <span class="card-line"></span>

                        </div>

                    </button>


                    <!-- EMPRESAS -->

                    <button
                        type="button"
                        class="card"
                        data-node="empresas"
                    >

                        <div class="card-icon empresas">

                            <svg viewBox="0 0 24 24">

                                <rect
                                    x="4"
                                    y="7"
                                    width="16"
                                    height="13"
                                    rx="1"
                                ></rect>

                                <path
                                    d="M9 7V4h6v3"
                                ></path>

                                <path
                                    d="M4 11h16"
                                ></path>

                            </svg>

                        </div>


                        <div>

                            <h3>
                                Empresas
                            </h3>

                            <p>
                                Encontre profissionais ideais.
                            </p>

                            <span class="card-line"></span>

                        </div>

                    </button>


                    <!-- OPORTUNIDADES -->

                    <button
                        type="button"
                        class="card"
                        data-node="oportunidades"
                    >

                        <div class="card-icon oportunidades">

                            <svg viewBox="0 0 24 24">

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="8"
                                ></circle>

                                <path
                                    d="M12 8v8"
                                ></path>

                                <path
                                    d="M8 12h8"
                                ></path>

                            </svg>

                        </div>


                        <div>

                            <h3>
                                Oportunidades
                            </h3>

                            <p>
                                Descubra novas oportunidades.
                            </p>

                            <span class="card-line"></span>

                        </div>

                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================================
             LADO DIREITO
             NETWORK DO NEXT WORK
        ====================================================== -->

        <section class="lado-direito network">

            <!-- =================================================
                 ÓRBITAS
            ================================================== -->

            <div class="orbit orbit-big"></div>

            <div class="orbit orbit-small"></div>


            <!-- =================================================
                 LINHAS
            ================================================== -->

            <div class="line line-talentos"></div>

            <div class="line line-empresas"></div>

            <div class="line line-oportunidades"></div>


            <!-- =================================================
                 CENTRO
            ================================================== -->

            <button
                type="button"
                class="center"
            >

                <div class="center-logo">

                    <img
                        src="next work.png"
                        alt="Logo Next Work"
                    >

                </div>

            </button>


            <!-- =================================================
                 TALENTOS
            ================================================== -->

            <button
                type="button"
                class="network-item talentos-item"
                data-node="talentos"
            >

                <div class="network-icon">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="9"
                            cy="8"
                            r="3"
                        ></circle>

                        <path
                            d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"
                        ></path>

                        <circle
                            cx="17"
                            cy="9"
                            r="2"
                        ></circle>

                        <path
                            d="M16 14c2.8 0 5 2.2 5 5"
                        ></path>

                    </svg>

                </div>

                <strong>
                    Talentos
                </strong>

            </button>


            <!-- =================================================
                 EMPRESAS
            ================================================== -->

            <button
                type="button"
                class="network-item empresas-item"
                data-node="empresas"
            >

                <div class="network-icon">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="4"
                            y="7"
                            width="16"
                            height="13"
                            rx="1"
                        ></rect>

                        <path
                            d="M9 7V4h6v3"
                        ></path>

                        <path
                            d="M4 11h16"
                        ></path>

                    </svg>

                </div>

                <strong>
                    Empresas
                </strong>

            </button>


            <!-- =================================================
                 OPORTUNIDADES
            ================================================== -->

            <button
                type="button"
                class="network-item oportunidades-item"
                data-node="oportunidades"
            >

                <div class="network-icon">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="12"
                            cy="12"
                            r="8"
                        ></circle>

                        <path
                            d="M12 8v8"
                        ></path>

                        <path
                            d="M8 12h8"
                        ></path>

                    </svg>

                </div>

                <strong>
                    Oportunidades
                </strong>

            </button>

        </section>

    </main>


    <!-- =========================================================
         JAVASCRIPT DA TELA INICIAL
    ========================================================== -->

    <script src="telainicial.js"></script>

</body>

</html>
