<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emprega Mais</title>

    <link rel="stylesheet" href="Telainicial.css">
</head>

<body>

    <!-- ========================================
         HEADER
    ======================================== -->
<div class="logoalta">
    <header class="header">
        <a href="#" class="logo">
           
            <img src="logo site.png" alt="Logo" >
        
        </a>
        
        </div>
    </header>


    <!-- ========================================
         HERO
    ======================================== -->

    <main class="hero">

        <!-- ====================================
             LADO ESQUERDO
        ===================================== -->

        <section class="hero-content">

            <div class="tag">
                <span>✦</span>
                CONECTANDO PESSOAS
            </div>

            <h1>
                Conectamos
                <span>talentos</span>
                e oportunidades.
            </h1>

            <p class="description">
                Uma plataforma criada para aproximar pessoas,
                empresas e novas oportunidades de forma simples
                e inteligente.
            </p>


            <!-- BOTÕES -->

            <div class="buttons">

                <a href="#" class="button primary"  >
                     começar agora
                    <span>→</span>
                </a>

                <a href="#" class="button secondary">
                    Saiba mais
                </a>

            </div>


            <!-- ====================================
                 CARDS
            ===================================== -->

            <div class="cards">

                <!-- TALENTOS -->

                <button class="card" data-node="talentos">

                    <div class="card-icon talentos">

                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="8" r="3"></circle>
                            <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>

                            <circle cx="17" cy="9" r="2"></circle>
                            <path d="M16 14c2.8 0 5 2.2 5 5"></path>
                        </svg>

                    </div>

                    <div>

                        <h3>Talentos</h3>

                        <p>
                            Encontre oportunidades
                            para mostrar seu talento.
                        </p>

                        <span class="card-line"></span>

                    </div>

                </button>


                <!-- EMPRESAS -->

                <button class="card" data-node="empresas">

                    <div class="card-icon empresas">

                        <svg viewBox="0 0 24 24">
                            <rect x="4" y="7" width="16" height="13" rx="1"></rect>
                            <path d="M9 7V4h6v3"></path>
                            <path d="M4 11h16"></path>
                        </svg>

                    </div>

                    <div>

                        <h3>Empresas</h3>

                        <p>
                            Encontre profissionais ideais
                            para sua empresa.
                        </p>

                        <span class="card-line"></span>

                    </div>

                </button>


                <!-- OPORTUNIDADES -->

                <button class="card" data-node="oportunidades">

                    <div class="card-icon oportunidades">

                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="8"></circle>
                            <path d="M12 8v8"></path>
                            <path d="M8 12h8"></path>
                        </svg>

                    </div>

                    <div>

                        <h3>Oportunidades</h3>

                        <p>
                            Descubra novas oportunidades.
                        </p>

                        <span class="card-line"></span>

                    </div>

                </button>

            </div>

        </section>


        <!-- ====================================
             LADO DIREITO / NETWORK
        ===================================== -->

        <section class="network">

            <!-- ÓRBITAS -->

            <div class="orbit orbit-big"></div>
            <div class="orbit orbit-small"></div>


            <!-- LINHAS -->

            <div class="line line-talentos"></div>
            <div class="line line-empresas"></div>
            <div class="line line-oportunidades"></div>

            <!-- CENTRO -->

            <button class="center">

                <div class="center-logo">
                    <img src="logo site.png" alt="Logo">
                </div>

            </button>


            <!-- TALENTOS -->

            <button class="network-item talentos-item">

                <div class="network-icon">

                    <svg viewBox="0 0 24 24">
                        <circle cx="9" cy="8" r="3"></circle>
                        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>

                        <circle cx="17" cy="9" r="2"></circle>
                        <path d="M16 14c2.8 0 5 2.2 5 5"></path>
                    </svg>

                </div>

                <strong>Talentos</strong>

            </button>


            <!-- EMPRESAS -->

            <button class="network-item empresas-item">

                <div class="network-icon">

                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="7" width="16" height="13" rx="1"></rect>
                        <path d="M9 7V4h6v3"></path>
                        <path d="M4 11h16"></path>
                    </svg>

                </div>

                <strong>Empresas</strong>

            </button>


            <!-- OPORTUNIDADES DO DIAGRAMA -->

            <button class="network-item oportunidades-item">

                <div class="network-icon">

                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8"></circle>
                        <path d="M12 8v8"></path>
                        <path d="M8 12h8"></path>
                    </svg>

                </div>

                <strong>Oportunidades</strong>

            </button>

        </section>

    </main>

</body>

<link rel="stylesheet" href="telainicial.js">

</html>
