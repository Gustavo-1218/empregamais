<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Work</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="Telainicial.css">
    

</head>

<body>

    <main class="pagina-login">

        <section class="lado-esquerdo">

            <div class="logo-principal">

                <img
                    src="logoreta.png"
                    alt="Next Work"
                >

            </div>

            <div class="inicio-area">

                <div class="tag">

                    <span></span>

                    CONECTANDO PESSOAS

                </div>

                <div class="titulo-inicio">

                    <h1>

                        Conectamos

                        <span>talentos</span>

                        e oportunidades.

                    </h1>

                </div>

                <p class="description">

                    Uma plataforma criada para aproximar pessoas,
                    empresas e novas oportunidades de forma simples
                    e inteligente.

                </p>

                <div class="buttons">

                    <a
                        href="loginpage.html"
                        class="button primary"
                    >

                        Começar agora

                        <span>→</span>

                    </a>

                    <a
                        href="saibamais.html"
                        class="button secondary"
                    >

                        Saiba mais

                    </a>

                </div>

            </div>

        </section>


        <section class="lado-direito">

            <img
                src="fotopessoas.png"
                alt="Pessoa utilizando o Next Work"
                class="imagem-inicio"
            >

        </section>

    </main>


  <button
    type="button"
    id="abrirNextAssistant"
    class="botao-assistente"
>
    <img src="audioo.png" alt="Abrir Next Assistant">
</button>

<iframe
    id="nextAssistantFrame"
    src="next-assistant.html"
    title="Next Assistant"
></iframe>

<script>
    const botaoAssistant =
        document.getElementById("abrirNextAssistant");

    const frameAssistant =
        document.getElementById("nextAssistantFrame");

    botaoAssistant.addEventListener("click", function () {
        frameAssistant.style.display = "block";
    });
</script>
</body>

</html>
