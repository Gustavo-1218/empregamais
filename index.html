<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Work</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="Telainicial.css">
    <link rel="stylesheet" href="next-assistant.css">

</head>

<body>

    <main class="pagina-login">

        <section class="lado-esquerdo">

            <div class="logo-principal">

                <img
                    src="nova logo.png"
                    alt="Next Work"
                >

            </div>

            <div class="inicio-area">

                <div class="tag">

                    <span></span>

                    CONECTANDO PESSOAS

                </div>

                <div class="titulo-inicio">

                    <h1>

                        Conectamos

                        <span>talentos</span>

                        e oportunidades.

                    </h1>

                </div>

                <p class="description">

                    Uma plataforma criada para aproximar pessoas,
                    empresas e novas oportunidades de forma simples
                    e inteligente.

                </p>

                <div class="buttons">

                    <a
                        href="loginpage.html"
                        class="button primary"
                    >

                        Começar agora

                        <span>→</span>

                    </a>

                    <a
                        href="saibamais.html"
                        class="button secondary"
                    >

                        Saiba mais

                    </a>

                </div>

            </div>

        </section>


        <section class="lado-direito">

            <img
                src="fotopessoas.png"
                alt="Pessoa utilizando o Next Work"
                class="imagem-inicio"
            >

        </section>

    </main>


    <!-- =====================================================
         NEXT ASSISTANT
    ====================================================== -->

    <div id="next-assistant-container">

        <button
            id="nextAssistantButton"
            class="next-assistant-button"
            type="button"
            aria-label="Abrir Next Assistant"
        >

            <img
                src="audioo.png"
                alt="Next Assistant"
            >

        </button>


        <div
            id="nextAssistantChat"
            class="next-assistant-chat"
            aria-hidden="true"
        >

            <div class="next-assistant-header">

                <div class="next-assistant-title">

                    <div class="next-assistant-icon">
                        🤖
                    </div>

                    <div>

                        <strong>Next Assistant</strong>

                        <span>
                            Como posso ajudar?
                        </span>

                    </div>

                </div>

                <button
                    id="nextAssistantClose"
                    type="button"
                    aria-label="Fechar Next Assistant"
                >
                    ×
                </button>

            </div>


            <div
                id="nextAssistantMessages"
                class="next-assistant-messages"
            >

                <div class="next-assistant-message assistant">

                    Olá! Eu sou o Next Assistant.
                    Como posso ajudar?

                </div>

            </div>


            <div class="next-assistant-input-area">

                <input
                    id="nextAssistantInput"
                    type="text"
                    placeholder="Digite sua pergunta..."
                    autocomplete="off"
                >

                <button
                    id="nextAssistantSend"
                    type="button"
                    aria-label="Enviar pergunta"
                >
                    ➤
                </button>

                <button
                    id="nextAssistantVoice"
                    type="button"
                    aria-label="Falar com o Next Assistant"
                >
                    🎙
                </button>

            </div>

        </div>

    </div>


    <script src="next-assistant.js"></script>

</body>

</html>
