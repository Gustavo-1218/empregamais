<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Work - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="loginpage.css">
</head>

<body>

    <main class="pagina-login">

        <!-- =====================================================
             LADO ESQUERDO
        ====================================================== -->

        <section class="lado-esquerdo">

            <!-- LOGO -->

            <div class="logo-principal">

                <img
                    src="nova logo.png"
                    alt="Next Work"
                >

            </div>


            <!-- =================================================
                 ÁREA DE LOGIN
            ================================================== -->

            <div class="login-area">

                <div class="titulo-login">

                    <h1>
                        Seu próximo passo
                        <span>começa aqui.</span>
                    </h1>

                </div>


                <!-- =================================================
                     CARD DE LOGIN
                ================================================== -->

                <div class="card-login">

                    <div class="cabecalho-login">

                        <h2>
                            Entrar na sua conta
                        </h2>

                        <p>
                            Acesse sua conta para continuar.
                        </p>

                    </div>


                    <form id="formLogin">

                        <!-- E-MAIL OU CPF -->

                        <div class="campo">

                            <label for="email">
                                E-mail ou CPF
                            </label>

                            <div class="input-box">

                                <span class="icone icone-email"></span>

                                <input
                                    type="text"
                                    id="email"
                                    placeholder="Digite seu e-mail ou CPF"
                                    autocomplete="username"
                                    required
                                >

                            </div>

                        </div>


                        <!-- SENHA -->

                        <div class="campo">

                            <div class="linha-senha">

                                <label for="senha">
                                    Senha
                                </label>

                                <button
                                    type="button"
                                    id="esqueciSenha"
                                    class="link-senha"
                                >
                                    Esqueceu a senha?
                                </button>

                            </div>


                            <div class="input-box">

                                <span class="icone icone-senha"></span>

                                <input
                                    type="password"
                                    id="senha"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    id="mostrarSenha"
                                    class="mostrar-senha"
                                    aria-label="Mostrar senha"
                                >
                                    ◉
                                </button>

                            </div>

                        </div>


                        <!-- LEMBRAR DE MIM -->

                        <label class="lembrar">

                            <input
                                type="checkbox"
                                id="lembrar"
                            >

                            <span class="checkbox-personalizado"></span>

                            <span>
                                Lembrar de mim
                            </span>

                        </label>


                        <!-- BOTÃO ENTRAR -->

                        <button
                            type="submit"
                            class="btn-entrar"
                        >

                            <span>
                                Entrar
                            </span>

                            <strong>
                                →
                            </strong>

                        </button>

                    </form>


                    <!-- =================================================
                         DIVISOR
                    ================================================== -->

                    <div class="divisor">

                        <span></span>

                        <p>
                            ou
                        </p>

                        <span></span>

                    </div>


                    <!-- =================================================
                         CADASTRO
                    ================================================== -->

                    <div class="cadastro">

                        <p>
                            Ainda não tem uma conta?
                        </p>

                        <a href="cadastroo.html">
                            Se candidatar →
                        </a>

                    </div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             LADO DIREITO
        ====================================================== -->

        <section class="lado-direito">

        </section>

    </main>


    <!-- =========================================================
         MENSAGEM DO LOGIN
    ========================================================== -->

    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <script src="loginpage.js"></script>

</body>

</html>
