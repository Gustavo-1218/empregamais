<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emprega Mais - Cadastro</title>

    <link rel="stylesheet" href="cadstyle.css">
</head>

<body>

    <main class="pagina-cadastro">


        <section class="cadastro-container">


            <div class="cadastro-logo">

                <h1>
                    EMPREGA <strong>MAIS</strong>
                </h1>

                <p>
                    Conectando talentos e oportunidades
                </p>

            </div>



            <div class="cadastro-titulo">

                <h2>
                    Crie sua conta
                </h2>

                <p>
                    Cadastre-se para começar a usar a Emprega Mais
                </p>

            </div>

            
            <form class="cadastro-form">



                <div class="campo-cadastro">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                </div>



                <div class="campo-cadastro">

                    <label for="cpf">
                        CPF
                    </label>

                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" maxlength="14" required>

                </div>



                <div class="campo-cadastro">

                    <label for="celular">
                        Celular
                    </label>

                    <input type="tel" id="celular" name="celular" placeholder="(00) 00000-0000" required>

                </div>



                <div class="campo-cadastro">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                </div>


                <div class="campo-cadastro">

                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

                </div>


                <div class="campo-cadastro">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input type="password" id="confirmar-senha" name="confirmar-senha"
                        placeholder="Digite a senha novamente" required>

                </div>


                <div class="termos-cadastro">

                    <label>

                        <input type="checkbox" required>

                        <span>
                            Aceito os termos de uso e a política de privacidade.
                        </span>

                    </label>

                </div>


                <button type="submit" class="botao-cadastro">
                    
                    <a href="digital.html" class="botao">
                        Criar conta →
                    </a>

                </button>

            </form>



            <div class="cadastro-login">

                <p>
                    Já possui uma conta?

                    <a href="digital.html">
                        Fazer login
                    </a>
                </p>

            </div>

        </section>

    </main>

</body>

</html>
