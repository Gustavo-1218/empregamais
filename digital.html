<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emprega Mais - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">


        <section class="login">



            <div class="logo">

                <h1>EMPREGA <strong>MAIS</strong></h1>
                <p>Conectando talentos e oportunidades</p>
            </div>

            <h2>Bem-vindo de volta!</h2>

            <p class="subtitulo">
                Faça login para acessar sua conta
            </p>

            <form>

                <label for="email-login">E-mail</label>

                <input type="email" id="email-login" placeholder="Digite seu e-mail">

                <label for="senha-login">Senha</label>

                <input type="password" id="senha-login" placeholder="Digite sua senha">

                <a href="#" class="esqueci">
                    Esqueci minha senha
                </a>
                <button type="button" onclick="window.location.href='emprega.html'">
                    começar agora →
                </button>
            </form>

            <p class="alternativa">
                Não tem uma conta?
                <a href="emprega.html">Crie sua conta</a>
            </p>

        </section>






    </main>

</body>

</html>
