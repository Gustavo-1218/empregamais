<div class="next-assistant-container" id="nextAssistantContainer">

    <button
        type="button"
        class="next-assistant-button"
        id="nextAssistantButton"
        aria-label="Abrir Next Assistant"
        aria-expanded="false"
    >
        <img
            src="audioo.png"
            alt=""
            class="next-assistant-image"
        >
    </button>


    <section
        class="next-assistant-chat"
        id="nextAssistantChat"
        aria-hidden="true"
    >

        <header class="next-assistant-header">

            <div class="next-assistant-header-info">

                <div class="next-assistant-mini-photo">
                    <img
                        src="ia quadrado.png"
                        alt=""
                    >
                </div>

                <div>
                    <h2>Next Assistant</h2>

                    <span class="next-assistant-status">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>

            </div>


            <button
                type="button"
                class="next-assistant-close"
                id="nextAssistantClose"
                aria-label="Fechar Next Assistant"
            >
                ×
            </button>

        </header>


        <div
            class="next-assistant-messages"
            id="nextAssistantMessages"
            aria-live="polite"
        >

            <div class="assistant-message">

                <div class="message-avatar">
                    <img
                        src="Ia quadrado.png"
                        alt=""
                    >
                </div>

                <div class="message-content">

                    <span class="message-name">
                        Next Assistant
                    </span>

                    <p>
                        Olá! Como posso ajudar você?
                    </p>

                </div>

            </div>

        </div>


        <div class="next-assistant-suggestions">

            <button
                type="button"
                class="suggestion-button"
                data-question="Quais vagas estão disponíveis perto de mim?"
            >
                Vagas próximas
            </button>

            <button
                type="button"
                class="suggestion-button"
                data-question="Quais profissionais estão perto de mim?"
            >
                Profissionais próximos
            </button>

            <button
                type="button"
                class="suggestion-button"
                data-question="Tem algum encanador disponível?"
            >
                Serviços disponíveis
            </button>

        </div>


        <form
            class="next-assistant-input-area"
            id="nextAssistantForm"
        >

            <button
                type="button"
                class="next-assistant-mic"
                id="nextAssistantMic"
                aria-label="Falar com o Next Assistant"
            >
                <img
                    src="audioo.png"
                    alt="Microfone"
                >
            </button>

        </form>

    </section>

</div>
