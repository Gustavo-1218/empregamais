<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        :root {
            --fundo: #020713;
            --fundo-secundario: #071225;
            --painel: rgba(8, 20, 40, 0.94);
            --painel-2: rgba(12, 29, 53, 0.88);

            --texto: #edf8ff;
            --texto-secundario: #9db8cc;

            --azul: #2399ff;
            --ciano: #00ddff;
            --roxo: #8d5cff;

            --borda: rgba(0, 221, 255, 0.20);
            --borda-hover: rgba(0, 221, 255, 0.45);

            --sombra: rgba(0, 0, 0, 0.45);
        }

        /* =====================================================
           MODO CLARO
        ===================================================== */

        body.modo-claro {
            --fundo: #eefaff;
            --fundo-secundario: #f7fcff;
            --painel: rgba(255, 255, 255, 0.96);
            --painel-2: #f4fbff;

            --texto: #102b4c;
            --texto-secundario: #526b84;

            --azul: #087cf0;
            --ciano: #00aeca;
            --roxo: #7147e8;

            --borda: rgba(8, 124, 240, 0.18);
            --borda-hover: rgba(8, 124, 240, 0.40);

            --sombra: rgba(20, 80, 120, 0.16);
        }

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(35, 153, 255, 0.09),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 15%,
                    rgba(141, 92, 255, 0.08),
                    transparent 28%
                ),
                var(--fundo);

            color: var(--texto);
            overflow: hidden;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        /* =====================================================
           CONTAINER PRINCIPAL
        ===================================================== */

        .assistant-page {
            position: relative;

            width: 100%;
            height: 100%;

            min-height: 500px;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =====================================================
           LINHAS DECORATIVAS
        ===================================================== */

        .background-line {
            position: absolute;

            width: 180px;
            height: 180px;

            border: 1px solid var(--borda);

            border-radius: 50%;

            pointer-events: none;
        }

        .background-line.one {
            top: -110px;
            right: -70px;
        }

        .background-line.two {
            bottom: -120px;
            left: -90px;
        }

        .background-line.three {
            width: 90px;
            height: 90px;

            top: 18%;
            left: 8%;

            opacity: 0.35;
        }

        /* =====================================================
           TOPO
        ===================================================== */

        .assistant-header {
            position: relative;
            z-index: 5;

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 22px;

            border-bottom: 1px solid var(--borda);

            background: rgba(2, 7, 19, 0.28);

            backdrop-filter: blur(15px);
        }

        body.modo-claro .assistant-header {
            background: rgba(255, 255, 255, 0.50);
        }

        .assistant-brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 221, 255, 0.16),
                    rgba(141, 92, 255, 0.16)
                );

            border: 1px solid var(--borda);

            color: var(--ciano);

            font-size: 17px;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.1;
        }

        .brand-text span {
            display: block;

            margin-top: 3px;

            color: var(--texto-secundario);

            font-size: 10px;
        }

        /* =====================================================
           BOTÃO DE TEMA
        ===================================================== */

        .theme-button {
            width: 38px;
            height: 38px;

            border: 1px solid var(--borda);
            border-radius: 50%;

            background: var(--painel-2);

            color: var(--texto);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.25s ease;
        }

        .theme-button:hover {
            border-color: var(--borda-hover);

            color: var(--ciano);

            transform: translateY(-2px);
        }

        /* =====================================================
           ÁREA CENTRAL
        ===================================================== */

        .assistant-content {
            position: relative;
            z-index: 2;

            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            justify-content: center;

            padding: 25px 20px 20px;

            text-align: center;
        }

        .assistant-photo {
            width: 62px;
            height: 62px;

            border-radius: 18px;

            overflow: hidden;

            border: 1px solid var(--borda);

            box-shadow:
                0 0 30px rgba(0, 221, 255, 0.10);

            margin-bottom: 14px;
        }

        .assistant-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .assistant-content h2 {
            font-size: clamp(22px, 4vw, 30px);

            font-weight: 600;

            margin-bottom: 5px;
        }

        .assistant-content .description {
            max-width: 430px;

            color: var(--texto-secundario);

            font-size: 12px;
            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* =====================================================
           MICROFONE
        ===================================================== */

        .microphone-area {
            position: relative;

            width: 150px;
            height: 150px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 22px;
        }

        .microphone-ring {
            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            border: 1px solid rgba(0, 221, 255, 0.16);

            transition: 0.3s ease;
        }

        .microphone-ring.two {
            width: 125px;
            height: 125px;

            border-color: rgba(141, 92, 255, 0.18);
        }

        .microphone-ring.three {
            width: 102px;
            height: 102px;

            border-color: rgba(35, 153, 255, 0.20);
        }

        .microphone-button {
            position: relative;
            z-index: 3;

            width: 82px;
            height: 82px;

            border-radius: 50%;

            border: 1px solid rgba(0, 221, 255, 0.55);

            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(0, 221, 255, 0.28),
                    rgba(35, 153, 255, 0.10) 50%,
                    rgba(141, 92, 255, 0.12)
                );

            box-shadow:
                0 0 25px rgba(0, 221, 255, 0.15);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .microphone-button img {
            width: 43px;
            height: 43px;

            object-fit: contain;
        }

        .microphone-button:hover {
            transform: scale(1.06);

            box-shadow:
                0 0 35px rgba(0, 221, 255, 0.28);
        }

        /* =====================================================
           MICROFONE OUVINDO
        ===================================================== */

        .microphone-area.ouvindo .microphone-ring {
            animation: pulsar 1.4s infinite ease-out;
        }

        .microphone-area.ouvindo .microphone-ring.two {
            animation-delay: 0.25s;
        }

        .microphone-area.ouvindo .microphone-ring.three {
            animation-delay: 0.5s;
        }

        .microphone-area.ouvindo .microphone-button {
            border-color: var(--ciano);

            box-shadow:
                0 0 25px rgba(0, 221, 255, 0.40),
                0 0 65px rgba(141, 92, 255, 0.18);
        }

        @keyframes pulsar {
            0% {
                transform: scale(0.90);
                opacity: 0.8;
            }

            70% {
                transform: scale(1.16);
                opacity: 0.15;
            }

            100% {
                transform: scale(1.20);
                opacity: 0;
            }
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .assistant-status {
            min-height: 20px;

            color: var(--texto-secundario);

            font-size: 11px;
        }

        .assistant-status.ouvindo {
            color: var(--ciano);
        }

        /* =====================================================
           RESPOSTA
        ===================================================== */

        .assistant-response {
            width: min(520px, 100%);

            margin-top: 20px;

            padding: 13px 16px;

            border: 1px solid var(--borda);
            border-radius: 15px;

            background: var(--painel);

            color: var(--texto-secundario);

            font-size: 11px;
            line-height: 1.6;

            opacity: 0;
            transform: translateY(8px);

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .assistant-response.visivel {
            opacity: 1;
            transform: translateY(0);
        }

        .assistant-response strong {
            color: var(--ciano);
        }

        /* =====================================================
           RODAPÉ
        ===================================================== */

        .assistant-footer {
            position: relative;
            z-index: 2;

            padding: 13px 20px;

            text-align: center;

            color: var(--texto-secundario);

            font-size: 9px;

            border-top: 1px solid var(--borda);
        }

        /* =====================================================
           RESPONSIVIDADE
        ===================================================== */

        @media (max-width: 500px) {

            .assistant-header {
                padding: 14px 16px;
            }

            .assistant-content {
                padding: 18px 15px;
            }

            .microphone-area {
                width: 135px;
                height: 135px;
            }

            .microphone-ring {
                width: 135px;
                height: 135px;
            }

            .microphone-ring.two {
                width: 112px;
                height: 112px;
            }

            .microphone-ring.three {
                width: 92px;
                height: 92px;
            }

            .microphone-button {
                width: 76px;
                height: 76px;
            }

            .assistant-content .description {
                margin-bottom: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="assistant-page">

        <div class="background-line one"></div>
        <div class="background-line two"></div>
        <div class="background-line three"></div>

        <!-- =================================================
             CABEÇALHO
        ================================================== -->

        <header class="assistant-header">

            <div class="assistant-brand">

                <div class="brand-icon">
                    ✦
                </div>

                <div class="brand-text">
                    <h1>Next Assistant</h1>
                    <span>Assistente inteligente do NEXT WORK</span>
                </div>

            </div>

            <button
                type="button"
                class="theme-button"
                id="themeButton"
                aria-label="Alternar tema"
            >
                ☾
            </button>

        </header>


        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <section class="assistant-content">

            <div class="assistant-photo">
                <img
                    src="ia quadrado.png"
                    alt="Next Assistant"
                >
            </div>

            <h2>Como posso ajudar?</h2>

            <p class="description">
                Fale com o Next Assistant para encontrar oportunidades,
                profissionais e serviços dentro da plataforma.
            </p>


            <!-- MICROFONE -->

            <div
                class="microphone-area"
                id="microphoneArea"
            >

                <div class="microphone-ring"></div>
                <div class="microphone-ring two"></div>
                <div class="microphone-ring three"></div>

                <button
                    type="button"
                    class="microphone-button"
                    id="microphoneButton"
                    aria-label="Falar com o Next Assistant"
                >

                    <img
                        src="audioo.png"
                        alt="Microfone"
                    >

                </button>

            </div>


            <div
                class="assistant-status"
                id="assistantStatus"
            >
                Toque no microfone para falar
            </div>


            <!-- RESPOSTA -->

            <div
                class="assistant-response"
                id="assistantResponse"
                aria-live="polite"
            ></div>

        </section>


        <!-- =================================================
             RODAPÉ
        ================================================== -->

        <footer class="assistant-footer">
            NEXT WORK • Seu próximo passo começa aqui
        </footer>

    </main>


    <script>

        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const themeButton =
            document.getElementById("themeButton");

        const microphoneButton =
            document.getElementById("microphoneButton");

        const microphoneArea =
            document.getElementById("microphoneArea");

        const assistantStatus =
            document.getElementById("assistantStatus");

        const assistantResponse =
            document.getElementById("assistantResponse");


        /* =====================================================
           MODO CLARO / ESCURO
        ===================================================== */

        let temaSalvo =
            localStorage.getItem("nextwork-assistente-tema");

        if (temaSalvo === "claro") {
            document.body.classList.add("modo-claro");
            themeButton.textContent = "☀";
        } else {
            themeButton.textContent = "☾";
        }


        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("modo-claro");

            const claro =
                document.body.classList.contains("modo-claro");

            if (claro) {

                localStorage.setItem(
                    "nextwork-assistente-tema",
                    "claro"
                );

                themeButton.textContent = "☀";

            } else {

                localStorage.setItem(
                    "nextwork-assistente-tema",
                    "escuro"
                );

                themeButton.textContent = "☾";
            }

        });


        /* =====================================================
           RESPOSTAS DEMONSTRATIVAS
        ===================================================== */

        const respostas = [

            {
                palavras: [
                    "vaga",
                    "vagas",
                    "emprego",
                    "empregos",
                    "trabalho",
                    "oportunidade"
                ],

                resposta:
                    "Encontrei algumas oportunidades disponíveis no NEXT WORK. Você pode acessar a página de vagas para visualizar os detalhes."
            },

            {
                palavras: [
                    "profissional",
                    "profissionais",
                    "pessoa",
                    "pessoas"
                ],

                resposta:
                    "O NEXT WORK possui uma área para encontrar profissionais e visualizar os serviços oferecidos."
            },

            {
                palavras: [
                    "encanador",
                    "eletricista",
                    "pedreiro",
                    "pintor",
                    "serviço",
                    "servicos"
                ],

                resposta:
                    "Existem serviços cadastrados na plataforma. Você pode pesquisar pelo tipo de serviço que procura."
            },

            {
                palavras: [
                    "empresa",
                    "empresas"
                ],

                resposta:
                    "Você pode encontrar empresas cadastradas e consultar informações sobre suas oportunidades."
            },

            {
                palavras: [
                    "olá",
                    "ola",
                    "oi",
                    "hey"
                ],

                resposta:
                    "Olá! Eu sou o Next Assistant. Estou aqui para ajudar você a navegar pelo NEXT WORK."
            }

        ];


        /* =====================================================
           ENCONTRAR RESPOSTA
        ===================================================== */

        function encontrarResposta(pergunta) {

            const texto =
                pergunta.toLowerCase();

            for (
                let i = 0;
                i < respostas.length;
                i++
            ) {

                const grupo =
                    respostas[i];

                for (
                    let j = 0;
                    j < grupo.palavras.length;
                    j++
                ) {

                    if (
                        texto.includes(
                            grupo.palavras[j]
                        )
                    ) {

                        return grupo.resposta;
                    }
                }
            }

            return "Ainda estou aprendendo. Tente perguntar sobre vagas, empresas, profissionais ou serviços.";
        }


        /* =====================================================
           FALAR A RESPOSTA
        ===================================================== */

        function falarResposta(texto) {

            if (!("speechSynthesis" in window)) {
                return;
            }

            window.speechSynthesis.cancel();

            const fala =
                new SpeechSynthesisUtterance(texto);

            fala.lang = "pt-BR";
            fala.rate = 1;
            fala.pitch = 1;

            window.speechSynthesis.speak(fala);
        }


        /* =====================================================
           RECONHECIMENTO DE VOZ
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let reconhecimento = null;

        let ouvindo = false;


        if (SpeechRecognition) {

            reconhecimento =
                new SpeechRecognition();

            reconhecimento.lang = "pt-BR";

            reconhecimento.continuous = false;

            reconhecimento.interimResults = false;


            reconhecimento.onstart =
                function () {

                    ouvindo = true;

                    microphoneArea.classList.add(
                        "ouvindo"
                    );

                    assistantStatus.classList.add(
                        "ouvindo"
                    );

                    assistantStatus.textContent =
                        "Estou ouvindo...";

                    assistantResponse.classList.remove(
                        "visivel"
                    );
                };


            reconhecimento.onresult =
                function (evento) {

                    const texto =
                        evento.results[0][0].transcript;

                    const resposta =
                        encontrarResposta(texto);

                    assistantResponse.innerHTML =
                        "<strong>Você:</strong> " +
                        texto +
                        "<br><br>" +
                        "<strong>Next Assistant:</strong> " +
                        resposta;

                    assistantResponse.classList.add(
                        "visivel"
                    );

                    assistantStatus.textContent =
                        "Resposta pronta";

                    falarResposta(resposta);
                };


            reconhecimento.onerror =
                function (evento) {

                    console.error(
                        "Erro no reconhecimento:",
                        evento.error
                    );

                    assistantStatus.textContent =
                        "Não consegui entender. Tente novamente.";
                };


            reconhecimento.onend =
                function () {

                    ouvindo = false;

                    microphoneArea.classList.remove(
                        "ouvindo"
                    );

                    assistantStatus.classList.remove(
                        "ouvindo"
                    );

                    if (
                        assistantStatus.textContent ===
                        "Estou ouvindo..."
                    ) {

                        assistantStatus.textContent =
                            "Toque no microfone para falar";
                    }
                };

        } else {

            assistantStatus.textContent =
                "Seu navegador não oferece reconhecimento de voz.";
        }


        /* =====================================================
           BOTÃO DO MICROFONE
        ===================================================== */

        microphoneButton.addEventListener(
            "click",
            function () {

                if (!reconhecimento) {

                    alert(
                        "O reconhecimento de voz não está disponível neste navegador."
                    );

                    return;
                }


                if (ouvindo) {

                    reconhecimento.stop();

                    return;
                }


                try {

                    reconhecimento.start();

                } catch (erro) {

                    console.error(erro);
                }

            }
        );

    </script>

</body>
</html>
